<div class="container mt-5">
  <h2 class="mb-4">Elenco Account</h2>
  <table class="table mt-3">
    <thead class="thead-dark">
      <tr>
        <th scope="col">nome</th>
        <th scope="col">valori</th>
        <th scope="col">voce</th>
        <th scope="col">dataCreazione</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <tr *ngFor="let valori of accounts.$values">
          <td>{{ valori.voce }}</td>
          <td>{{ valori.valori }}</td>
          <td>{{ valori.nome }}</td>
          <td>{{ valori.dataCreazione }}</td>
        </tr>
    </tbody>
  </table>
</div>

<!-- Modal for creating account -->
<div class="modal fade" id="addAccountModal" tabindex="-1" role="dialog" aria-labelledby="addAccountModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addAccountModalLabel">Create Account</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form [formGroup]="accountForm" (ngSubmit)="addAccount(formAggiungi.value)" novalidate  #formAggiungi="ngForm">
        <div class="modal-body">
          <div class="form-group">
            <label for="accountId">Account ID</label>
            <input type="text" class="form-control" id="accountId"  required>
          </div>
          <div >
            <div *ngFor="let value of values; let i = index" [formGroupName]="i">
              <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" formControlName="nome" required>
              </div>
              <div class="form-group">
                <label for="valoreString">Valore String</label>
                <input type="text" class="form-control" formControlName="valoreString">
              </div>
              <div formGroupName="valori">
                <div >
                  <div *ngFor="let subValue of value.valoreStr; let j = index" [formGroupName]="j">
                    <div class="form-group">
                      <label for="valoreStr">Valore Str</label>
                      <input type="text" class="form-control" formControlName="valoreStr">
                    </div>
                    <div class="form-group">
                      <label for="voce">Voce</label>
                      <input type="text" class="form-control" formControlName="voce">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Create Account</button>
        </div>
      </form>


    </div>
  </div>
</div>
