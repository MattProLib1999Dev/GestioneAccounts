<!-- MODAL PER CREARE ACCOUNT -->
<div class="modal fade" id="addAccountModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <form [formGroup]="accountForm" (ngSubmit)="addAccount()">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Nuovo Account</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">

            <!-- Nome -->
            <div class="col-md-4">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" formControlName="nome" />
            </div>

            <!-- Username -->
            <div class="col-md-4">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" formControlName="userName" />
            </div>

            <!-- Email -->
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" />
            </div>

            <!-- Telefono -->
            <div class="col-md-4">
              <label class="form-label">Telefono</label>
              <input type="tel" class="form-control" formControlName="phoneNumber" />
            </div>

            <!-- Password Hash -->
            <div class="col-md-4">
              <label class="form-label">Password Hash</label>
              <input type="text" class="form-control" formControlName="passwordHash" />
            </div>

            <!-- Accessi falliti -->
            <div class="col-md-4">
              <label class="form-label">Tentativi Accesso Falliti</label>
              <input type="number" class="form-control" formControlName="accessFailedCount" />
            </div>

            <!-- Email Confermata -->
            <div class="col-md-4 form-check mt-4">
              <input type="checkbox" class="form-check-input" formControlName="emailConfirmed" />
              <label class="form-check-label">Email Confermata</label>
            </div>

            <!-- Telefono Confermato -->
            <div class="col-md-4 form-check mt-4">
              <input type="checkbox" class="form-check-input" formControlName="phoneNumberConfirmed" />
              <label class="form-check-label">Telefono Confermato</label>
            </div>

            <!-- 2FA -->
            <div class="col-md-4 form-check mt-4">
              <input type="checkbox" class="form-check-input" formControlName="twoFactorEnabled" />
              <label class="form-check-label">2FA Abilitato</label>
            </div>
          </div>

          <!-- SEZIONE VALORI -->
          <hr />
          <h5>Valori</h5>
          <div [formGroup]="valoriForm" class="row g-3 mt-2">

            <!-- Nome Valore -->
            <div class="col-md-4">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" formControlName="nomeValore" />
            </div>

            <!-- Descrizione -->
            <div class="col-md-4">
              <label class="form-label">Descrizione</label>
              <input type="text" class="form-control" formControlName="descrizione" />
            </div>

            <!-- Valore Numerico -->
            <div class="col-md-4">
              <label class="form-label">Valore Numerico</label>
              <input type="number" class="form-control" formControlName="valoreNumerico" />
            </div>

            <!-- Valore Stringa -->
            <div class="col-md-4">
              <label class="form-label">Valore Stringa</label>
              <input type="text" class="form-control" formControlName="valoreString" />
            </div>

            <!-- Voce -->
            <div class="col-md-4">
              <label class="form-label">Voce</label>
              <input type="text" class="form-control" formControlName="voce" />
            </div>

            <!-- Data Creazione Valore -->
            <div class="col-md-4">
              <label class="form-label">Data Creazione</label>
              <input type="datetime-local" class="form-control" formControlName="dataCreazioneValore" />
            </div>
          </div>
        </div>

        <!-- BOTTONI -->
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Salva Account</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
        </div>
      </form>
    </div>
  </div>
</div>
