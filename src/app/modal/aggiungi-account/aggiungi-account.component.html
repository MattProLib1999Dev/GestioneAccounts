<div class="container mt-5">
  <h2 class="mb-4">Elenco Account</h2>
  <table class="table mt-3">
    <thead class="thead-dark">
      <tr>
        <th scope="col">nome</th>
        <th scope="col">valore</th>
        <th scope="col">voce</th>
        <th scope="col">dataCreazione</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <tr *ngFor="let valori of accounts.$values">
          <td>{{ valori.nome }}</td>
          <td>{{ valori.valoreString }}</td>
          <td>{{ valori.voce }}</td>
          <td>{{ valori.dataCreazione }}</td>
        </tr>
    </tbody>
  </table>
</div>


<div class="modal fade" id="addAccountModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Nuovo Account</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div style="border: 1px solid #040404; padding: 10px; border-radius: 5px;">
          <form [formGroup]="accountForm" (ngSubmit)="addAccount(accountForm.value)">
            <div class="form-group">
              <label for="recipient-name" class="col-form-label">Nome:</label>
              <input type="text" class="form-control" formControlName="nome" placeholder="Nome account" style="margin-bottom: 10px;">
              <div class="form-group bs5-card-border">
                <label for="message-text" class="col-form-label">Voce valore:</label>
                <input type="text" class="form-control" formControlName="voce" placeholder="Voce account">
                <label for="message-text" class="col-form-label">ValoreStr valore:</label>
                <input type="text" class="form-control" formControlName="valoreString" placeholder="valoreString">
                <label for="message-text" class="col-form-label">Data creazione valore:</label>
                <input type="date" class="form-control" formControlName="dataCreazione" placeholder="Data creazione account">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-success">Send Account</button>
            </div>
          </form>

        </div>
        <div class="modal-footer">
        </div>
      </div>
    </div>
  </div>
</div>
