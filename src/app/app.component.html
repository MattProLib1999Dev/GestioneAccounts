<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<div class="container">

  <div class="container">
    <div class="row ca" style="border: 2px solid black; padding: 3px; margin: 50px; background-color: beige;">
      <div class="col-md-6 offset-md-3">

        <h1 style="text-align: center;">{{ title }}</h1>

        @if (!isRegistered) {
          <h2 style="text-align: center;">Loggati</h2>
          <form (ngSubmit)="login(registerDto)" style="text-align: center;">
            <div> name: <input [(ngModel)]="registerDto.name" class="form-control" style="width: 500px;" name="name"></div>
            <div> email: <input [(ngModel)]="registerDto.email" class="form-control" style="width: 500px;" name="email"></div>
            <div> password: <input [(ngModel)]="registerDto.password" class="form-control" style="width: 500px;" name="password"></div>
            <button class="btn btn-primary" style="margin-top: 5px;" type="submit">Login</button>
          </form>
          <button class="btn btn-link" (click)="toggleRegistrationForm()">Registrati</button>
        } @else {
          <h2 style="text-align: center;">Registrati</h2>
          <form (ngSubmit)="register(registerDto)" style="text-align: center;">
            <div> name: <input [(ngModel)]="registerDto.name" class="form-control" style="width: 500px;" name="name"></div>
            <div> email: <input [(ngModel)]="registerDto.email" class="form-control" style="width: 500px;" name="email"></div>
            <div> password: <input [(ngModel)]="registerDto.password" class="form-control" style="width: 500px;" name="password"></div>
            <button type="submit" class="btn btn-primary" style="margin-top: 5px;">Registrati</button>
          </form>
          <button class="btn btn-link" (click)="toggleRegistrationForm()">Torna al login</button>
        }

      </div>
    </div>
  </div>



  <!-- app.component.html -->

  <!-- Usa i componenti nel template -->
  @if (isLoggedIn) {
  <p style="color: rgb(54, 193, 54);" style="text-align: center;">Login successful!</p>
  <app-account></app-account>
  } @else {
  <p style="color: rgb(231, 35, 35);" style="text-align: center;">Login failed. Please try again.</p>
  }
</div>
